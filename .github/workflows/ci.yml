name: Tests and security regression checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and tests
        run: python -m pip install -e . pytest
      - name: Python syntax check
        run: python -m compileall -q geneva.py cli.py agents tests
      - name: Python test suite
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and scoring tests
        run: |
          node --check web/calculator.js
          node --check web/ui.js
          node --test web/calculator.test.cjs

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag geneva-score-smoke .
      - name: Run app and verify HTTP workflows
        run: |
          docker run -d --rm --name geneva-smoke -p 127.0.0.1:18000:8000 geneva-score-smoke
          trap 'docker stop geneva-smoke' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/health | grep -q HEALTHY
          curl -fsS http://127.0.0.1:18000/ | grep -q 'Revised Geneva Score'
          curl -fsS http://127.0.0.1:18000/calculator.js | grep -q calculateScore
          curl -fsS -X POST http://127.0.0.1:18000/api/geneva \
            -H 'Content-Type: application/json' \
            -d '{"age":66,"heart_rate":95,"previous_dvt_pe":true,"surgery_or_fracture_1mo":false,"active_malignancy":false,"unilateral_leg_pain":false,"hemoptysis":true,"deep_vein_tenderness_and_unilateral_edema":false}' \
            | grep -q '"score":11'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/api/audit/logs)" = "403"
