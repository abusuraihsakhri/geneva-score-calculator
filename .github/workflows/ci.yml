name: Tests and security regression checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and tests
        run: python -m pip install -e . pytest
      - name: Python syntax check
        run: python -m compileall -q geneva.py cli.py agents tests
      - name: Python test suite
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and scoring tests
        run: |
          node --check web/calculator.js
          node --check web/ui.js
          node --test web/calculator.test.cjs
