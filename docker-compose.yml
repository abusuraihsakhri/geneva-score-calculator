services:
  geneva-score-calculator:
    build: .
    container_name: geneva-score-calculator
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-}
      - GENEVA_LEGACY_API_TOKEN=${GENEVA_LEGACY_API_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
